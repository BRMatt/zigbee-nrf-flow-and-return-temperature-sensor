# Show probe readings on the Seeed Expansion Base for XIAO's OLED.
# Not for battery use - the display draws far more than the rest of the sensor.
#
#   west build -b xiao_ble -p -d build_screen -- \
#     -DEXTRA_CONF_FILE=xiao_expansion_base.conf \
#     -DEXTRA_DTC_OVERLAY_FILE=xiao_expansion_base.overlay

CONFIG_FART_SCREEN=y
CONFIG_DISPLAY=y
CONFIG_CHARACTER_FRAMEBUFFER=y

# The character framebuffer allocates its 1 KB buffer from the heap.
CONFIG_HEAP_MEM_POOL_SIZE=4096
